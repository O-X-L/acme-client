    id: 1
    certs:
      - id: 1
        challenge_type: "http-01"
        provider: "https://acme-staging-v02.api.letsencrypt.org/directory"
        domains:
          - 'aaa.waf.alpenmesh.com'
          - 'bbb.waf.alpenmesh.com'
          - 'ccc.waf.alpenmesh.com'

      - id: 2
        challenge_type: "http-01"
        provider: "https://acme-staging-v02.api.letsencrypt.org/directory"
        domains:
          - 'ddd.waf.alpenmesh.com'
          - 'eee.waf.alpenmesh.com'
          - 'ddd.waf.alpenmesh.com'

  - name: "App #2"
    id: 2

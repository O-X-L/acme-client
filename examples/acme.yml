---

path_web: '/tmp/acme-www'
path_certs: '/tmp/acme-certs'
file_mode_cert: 0644
file_mode_key: 0640
file_group: 'ssl-cert'
create_bundle: true

email: 'test@waf.alpenmesh.com'
retries: 1
cooldown_sec: 2
renewal_days: 14
max_domains: 3
# hook_cmd: 'sudo systemctl reload haproxy.service'
# hook_cmd: 'touch /tmp/acme-test/reload-required'

groups:
  - name: "App #1"
    id: 1
    services:
      - id: 1
        challenge_type: "http-01"
        provider: "https://acme-staging-v02.api.letsencrypt.org/directory"
        domains:
          - 'aaa.waf.alpenmesh.com'
          - 'bbb.waf.alpenmesh.com'
          - 'ccc.waf.alpenmesh.com'

      - id: 2
        challenge_type: "http-01"
        provider: "letsencrypt_staging"
        domains:
          - 'ddd.waf.alpenmesh.com'
          - 'eee.waf.alpenmesh.com'
          - 'ddd.waf.alpenmesh.com'

  - name: "App #2"
    id: 2
    services:
      - id: 1
        challenge_type: "http-01"
        provider: "letsencrypt_staging"
        domains:
          - 'fff.waf.alpenmesh.com'
          - 'ggg.waf.alpenmesh.com'
          - 'hhh.waf.alpenmesh.com'
          # batch 2
          - 'kkk.waf.alpenmesh.com'

  - name: "App #3"
    id: 3
    services:
      - id: 1
        challenge_type: "dns-01"
        provider: "googledomains"
        domains:
          - '*.alpenmesh.net'

---

name: Lint

on:
  push:
    branches: [latest]
    paths:
      - '**.go'
      - '.golangci_fail.yml'
      - '.golangci_warn.yml'
      - '.github/workflows/lint.yml'
      - 'scripts/lint.sh'
  pull_request:
    branches: [latest]
    paths:
      - '**.go'
      - '.golangci_fail.yml'
      - '.golangci_warn.yml'
      - '.github/workflows/lint.yml'
      - 'scripts/lint.sh'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/go.mod'
          cache: true

      - name: Restore Go Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download module-dependencies
        run: |
          cd src/
          go mod tidy

      # NOTE: not using 'golangci/golangci-lint-action' because of warn/error split
      - name: Install dependencies
        run: |
          sudo apt install curl
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.6.0

      - name: Verifying golangci-lint
        run: |
          which golangci-lint
          golangci-lint version

      - name: Linting
        run: bash scripts/lint.sh
